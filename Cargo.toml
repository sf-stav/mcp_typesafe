[package]
name = "mcp_typesafe"
version = "0.1.0"
edition = "2024"

[dependencies]
# MCP SDK
rmcp = { version = "0.8", features = [
    "server",
    "macros",
    "transport-sse-server",
    "transport-io",
    "schemars",
] }

# Async runtime
tokio = { version = "1", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "io-std",
    "signal",
] }
tokio-util = { version = "0.7" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "std",
    "fmt",
] }
tracing-appender = "0.2"

# CLI argument parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Web server for SSE
axum = { version = "0.8" }

# JSON Schema
schemars = "1.0"
